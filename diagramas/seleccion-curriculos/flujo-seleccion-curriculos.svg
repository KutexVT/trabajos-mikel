<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title{font:700 60px 'DejaVu Sans',sans-serif;fill:#f8fafc;letter-spacing:-1px}
      .subtitle{font:400 25px 'DejaVu Sans',sans-serif;fill:#b9c8d8}
      .eyebrow{font:700 16px 'DejaVu Sans',sans-serif;fill:#5eead4;letter-spacing:3px}
      .step{font:700 15px 'DejaVu Sans',sans-serif;fill:#062033}
      .card-title{font:700 24px 'DejaVu Sans',sans-serif;fill:#f8fafc}
      .body{font:400 17px 'DejaVu Sans',sans-serif;fill:#b9c8d8}
      .footer{font:600 19px 'DejaVu Sans',sans-serif;fill:#d8e4ee}
      .note{font:500 17px 'DejaVu Sans',sans-serif;fill:#8fa5b9}
      .card{fill:#102b48;stroke:#294761;stroke-width:2}
      .icon{fill:none;stroke:#67e8f9;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .connector{fill:none;stroke:#5eead4;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1720" cy="90" r="310" fill="#0ea5e9" opacity="0.06"/>
  <circle cx="110" cy="1010" r="260" fill="#2dd4bf" opacity="0.05"/>

  <text x="120" y="110" class="eyebrow">FLUJO DE TRABAJO</text>
  <text x="120" y="180" class="title">Selección inteligente de currículos</text>
  <text x="120" y="225" class="subtitle">De cientos de postulaciones a una lista corta clara y respaldada por evidencia</text>

  <!-- Connectors -->
  <path d="M500 420H555" class="connector"/>
  <path d="M920 420H975" class="connector"/>
  <path d="M1340 420H1395" class="connector"/>
  <path d="M1580 555V630" class="connector"/>
  <path d="M1395 765H1340" class="connector"/>
  <path d="M975 765H920" class="connector"/>
  <path d="M555 765H500" class="connector"/>

  <!-- 1 -->
  <g filter="url(#shadow)">
    <rect x="120" y="300" width="380" height="255" rx="24" class="card"/>
  </g>
  <rect x="150" y="330" width="66" height="32" rx="16" fill="url(#accent)"/>
  <text x="183" y="352" text-anchor="middle" class="step">01</text>
  <g transform="translate(414 328)" class="icon">
    <path d="M0 11h22l7 8h31v39H0z"/><path d="M13 39h34M30 29v20"/>
  </g>
  <text x="150" y="410" class="card-title">Recepción</text>
  <text x="150" y="448" class="body">Los currículos llegan desde el</text>
  <text x="150" y="476" class="body">portal de empleo o una carpeta</text>
  <text x="150" y="504" class="body">centralizada</text>

  <!-- 2 -->
  <g filter="url(#shadow)">
    <rect x="555" y="300" width="365" height="255" rx="24" class="card"/>
  </g>
  <rect x="585" y="330" width="66" height="32" rx="16" fill="url(#accent)"/>
  <text x="618" y="352" text-anchor="middle" class="step">02</text>
  <g transform="translate(840 326)" class="icon">
    <path d="M25 0v38M10 24l15 15 15-15"/><path d="M2 47v12h46V47"/>
  </g>
  <text x="585" y="410" class="card-title">Descarga automática</text>
  <text x="585" y="448" class="body">El sistema obtiene archivos PDF</text>
  <text x="585" y="476" class="body">y Word sin trabajo manual</text>

  <!-- 3 -->
  <g filter="url(#shadow)">
    <rect x="975" y="300" width="365" height="255" rx="24" class="card"/>
  </g>
  <rect x="1005" y="330" width="66" height="32" rx="16" fill="url(#accent)"/>
  <text x="1038" y="352" text-anchor="middle" class="step">03</text>
  <g transform="translate(1256 328)" class="icon">
    <rect x="0" y="5" width="55" height="48" rx="9"/><path d="M15 21h25M15 31h18M15 41h22M27 -2v7"/>
  </g>
  <text x="1005" y="410" class="card-title">Lectura con IA</text>
  <text x="1005" y="448" class="body">Extrae experiencia y estudios</text>
  <text x="1005" y="476" class="body">habilidades e información clave</text>

  <!-- 4 -->
  <g filter="url(#shadow)">
    <rect x="1395" y="300" width="405" height="255" rx="24" class="card"/>
  </g>
  <rect x="1425" y="330" width="66" height="32" rx="16" fill="url(#accent)"/>
  <text x="1458" y="352" text-anchor="middle" class="step">04</text>
  <g transform="translate(1710 330)" class="icon">
    <rect x="0" y="0" width="20" height="20" rx="4"/><rect x="30" y="0" width="20" height="20" rx="4"/>
    <rect x="0" y="30" width="20" height="20" rx="4"/><rect x="30" y="30" width="20" height="20" rx="4"/>
  </g>
  <text x="1425" y="410" class="card-title">Clasificación</text>
  <text x="1425" y="448" class="body">Organiza cada candidato según</text>
  <text x="1425" y="476" class="body">el puesto o categoría correcta</text>

  <!-- 5 -->
  <g filter="url(#shadow)">
    <rect x="1395" y="630" width="405" height="270" rx="24" class="card"/>
  </g>
  <rect x="1425" y="660" width="66" height="32" rx="16" fill="url(#accent)"/>
  <text x="1458" y="682" text-anchor="middle" class="step">05</text>
  <g transform="translate(1710 657)" class="icon">
    <path d="M0 9h52M0 28h52M0 47h52"/><circle cx="15" cy="9" r="6" fill="#102b48"/><circle cx="37" cy="28" r="6" fill="#102b48"/><circle cx="23" cy="47" r="6" fill="#102b48"/>
  </g>
  <text x="1425" y="740" class="card-title">Configuración</text>
  <text x="1425" y="778" class="body">Una interfaz permite definir</text>
  <text x="1425" y="806" class="body">requisitos prioridades y pesos</text>
  <text x="1425" y="834" class="body">para cada vacante</text>

  <!-- 6 -->
  <g filter="url(#shadow)">
    <rect x="975" y="630" width="365" height="270" rx="24" class="card"/>
  </g>
  <rect x="1005" y="660" width="66" height="32" rx="16" fill="url(#accent)"/>
  <text x="1038" y="682" text-anchor="middle" class="step">06</text>
  <g transform="translate(1260 657)" class="icon">
    <path d="M2 28l15 15L51 5"/><path d="M50 27v24H4V5h32"/>
  </g>
  <text x="1005" y="740" class="card-title">Evaluación</text>
  <text x="1005" y="778" class="body">Compara cada perfil y asigna</text>
  <text x="1005" y="806" class="body">una puntuación con evidencia</text>
  <text x="1005" y="834" class="body">verificable</text>

  <!-- 7 -->
  <g filter="url(#shadow)">
    <rect x="555" y="630" width="365" height="270" rx="24" class="card"/>
  </g>
  <rect x="585" y="660" width="66" height="32" rx="16" fill="url(#accent)"/>
  <text x="618" y="682" text-anchor="middle" class="step">07</text>
  <g transform="translate(835 657)" class="icon">
    <path d="M0 50h52M6 50V29h11v21M23 50V18h11v32M40 50V5h11v45"/>
  </g>
  <text x="585" y="740" class="card-title">Lista de finalistas</text>
  <text x="585" y="778" class="body">Presenta los mejores candidatos</text>
  <text x="585" y="806" class="body">de cada puesto en orden claro</text>

  <!-- 8 -->
  <g filter="url(#shadow)">
    <rect x="120" y="630" width="380" height="270" rx="24" class="card"/>
  </g>
  <rect x="150" y="660" width="66" height="32" rx="16" fill="url(#accent)"/>
  <text x="183" y="682" text-anchor="middle" class="step">08</text>
  <g transform="translate(414 655)" class="icon">
    <circle cx="24" cy="16" r="13"/><path d="M0 56c2-18 11-26 24-26s22 8 24 26"/><path d="M38 42l8 8 14-17"/>
  </g>
  <text x="150" y="740" class="card-title">Decisión humana</text>
  <text x="150" y="778" class="body">Una persona revisa los resultados</text>
  <text x="150" y="806" class="body">y toma la decisión final</text>

  <line x1="120" y1="962" x2="1800" y2="962" stroke="#294761" stroke-width="2"/>
  <text x="120" y="1015" class="footer">AUTOMATIZACIÓN</text>
  <circle cx="330" cy="1008" r="4" fill="#5eead4"/>
  <text x="360" y="1015" class="footer">CRITERIOS PERSONALIZABLES</text>
  <circle cx="700" cy="1008" r="4" fill="#5eead4"/>
  <text x="730" y="1015" class="footer">RESULTADOS EXPLICABLES</text>
  <text x="1800" y="1015" text-anchor="end" class="note">La IA recomienda · La persona decide</text>
</svg>
